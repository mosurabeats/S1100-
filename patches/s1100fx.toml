# S1100FX patch spec -- applied by tools/patch.py to the stock OS file
# extracted from an Akai S1100 OS floppy.
#
# Every patch is checked against the original bytes before it is applied,
# so this file only works on the exact OS version it was written for.
# Record that version's hash below once you have it:
#   sha256sum build/stock_os.bin

[base]
# os_version = "4.40"
# sha256 = "<fill in>"

[payload]
source = "../src/fx.asm"
align = 16

# ---------------------------------------------------------------------------
# Milestone 1: prove the pipeline by changing visible text only.
# Find the boot banner with:  python3 tools/disasm.py strings build/stock_os.bin
# then set find_text to it exactly and replace_text to a same-length string.
# If find_text isn't found, patch.py lists similar strings to choose from.
[[patch]]
name = "boot-banner"
enabled = false                 # set true once find_text is confirmed
find_text = "S1100"
replace_text = "S11FX"

# ---------------------------------------------------------------------------
# Milestone 2+: hook the payload into the stock OS. Example shape only --
# the offset and expected bytes come from reverse engineering.
# [[patch]]
# name = "hook-main-loop"
# offset = 0x0000
# expect = "e8 00 00"            # the original 3-byte CALL being replaced
# asm = "call PAYLOAD_OFF + 3"   # -> fx_tick (which must then call the original)
