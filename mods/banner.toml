# BANNER: put S1100FX on screen -- text only, no code. The first mod to try
# on real hardware: build with `make first-test` (no payload, OS size
# unchanged) to prove the disk image boots before adding new code.
#
# The boot "AKAI" banner is in the ROM, not the OS file, so this renames
# the "PROGRAMS IN MEMORY" page title (MIDI mode program list).

[[patch]]
name = "banner-programs-title"
find_text = "PROGRAMS IN MEMORY"
replace_text = "S1100FX  PROGRAMS "
